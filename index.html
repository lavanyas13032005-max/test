<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="subtitle">Welcome back. Please enter your details.</p>

    <form id="signin-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
        <p id="email-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error">
          <button type="button" id="toggle-password" class="toggle" aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <p id="password-error" class="error" aria-live="polite"></p>
      </div>

      <button type="submit" id="submit" class="primary">Sign in</button>
      <p id="form-message" class="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
